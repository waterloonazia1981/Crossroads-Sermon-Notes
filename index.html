<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crossroads Sermon Notes</title>

  <style>
    :root {
      --crossroads-blue: #2d3e64;
      --crossroads-green: #3d7e46;

      --bg: #f5f7f4;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #667085;
      --border: #d8ded6;
      --soft-blue: rgba(45, 62, 100, 0.08);
      --soft-green: rgba(61, 126, 70, 0.10);
      --input-bg: #fbfdfb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, var(--soft-blue), transparent 34%),
        radial-gradient(circle at bottom right, var(--soft-green), transparent 34%),
        linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
      color: var(--text);
      line-height: 1.55;
      padding: 18px;
    }

    .page {
      max-width: 880px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 14px 35px rgba(45, 62, 100, 0.12);
    }

    .top-bar {
      height: 12px;
      background: linear-gradient(90deg, var(--crossroads-blue), var(--crossroads-green));
    }

    .content {
      padding: 24px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      max-width: 310px;
      width: 78%;
      height: auto;
      margin: 4px auto 18px;
      display: block;
    }

    .eyebrow {
      color: var(--crossroads-green);
      font-weight: bold;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.78rem;
    }

    h1 {
      margin: 8px 0 6px;
      font-size: clamp(1.85rem, 6vw, 2.8rem);
      color: var(--crossroads-blue);
      line-height: 1.1;
    }

    .subtitle {
      color: var(--muted);
      margin: 0;
      font-size: 1rem;
    }

    .meta {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin: 24px 0;
    }

    @media (min-width: 650px) {
      .meta {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .meta-box {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px;
      background: linear-gradient(180deg, #ffffff, #f8faf7);
    }

    .label {
      display: block;
      font-size: 0.76rem;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .value {
      font-weight: bold;
      color: var(--crossroads-blue);
    }

    .section {
      margin-top: 28px;
    }

    h2 {
      font-size: 1.22rem;
      color: var(--crossroads-blue);
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    .note-line {
      margin: 18px 0;
      font-size: 1.05rem;
    }

    input[type="text"] {
      width: min(100%, 270px);
      border: none;
      border-bottom: 2px solid var(--crossroads-green);
      background: var(--input-bg);
      padding: 7px 8px;
      font-size: 1rem;
      border-radius: 6px 6px 0 0;
      outline: none;
    }

    input[type="text"]:focus,
    textarea:focus {
      outline: 3px solid rgba(61, 126, 70, 0.18);
      border-color: var(--crossroads-green);
    }

    textarea {
      width: 100%;
      min-height: 125px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      font-size: 1rem;
      font-family: inherit;
      background: var(--input-bg);
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 28px;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 1rem;
      cursor: pointer;
      background: var(--crossroads-blue);
      color: white;
      font-weight: bold;
    }

    button:hover {
      filter: brightness(0.92);
    }

    button.secondary {
      background: var(--crossroads-green);
      color: white;
    }

    button.light {
      background: #edf2eb;
      color: var(--crossroads-blue);
    }

    .small-print {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 18px;
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }

      .card {
        box-shadow: none;
        border: none;
      }

      .top-bar,
      .buttons,
      .small-print {
        display: none;
      }

      input[type="text"],
      textarea {
        background: white;
      }
    }
  </style>
</head>

            <span class="value" id="speaker"></span>
          </div>
          <div class="meta-box">
            <span class="label">Scripture</span>
            <span class="value" id="scripture"></span>
          </div>
        </section>

        <section class="section">
          <h2>Fill-In Notes</h2>
          <div id="fillInNotes"></div>
        </section>

        <section class="section">
          <h2>Personal Notes</h2>
          <textarea id="personalNotes" placeholder="Write anything you want to remember here..."></textarea>
        </section>

        <section class="section">
          <h2>Prayer / Next Steps</h2>
          <textarea id="nextSteps" placeholder="What is God asking you to do with this message?"></textarea>
        </section>

        <div class="buttons">
          <button onclick="window.print()">Print / Save as PDF</button>
          <button class="secondary" onclick="downloadNotes()">Download My Notes</button>
          <button class="light" onclick="clearAnswers()">Clear My Notes</button>
        </div>

        <p class="small-print">
          Your answers stay on your device while this page is open. They are not submitted anywhere.
        </p>
      </div>
    </div>
  </main>

  <script>
    /*
      ============================================
      EDIT THIS SECTION EACH WEEK
      ============================================
      Change only the text below.
      For blanks, use four underscores like this: ____
    */

    const sermon = {
      churchName: "Crossroads Community Church of the Nazarene",
      title: "Deep Waters",
      subtitle: "Leaving The Shore",
      date: "Sunday, Aug 16th, 2026",
      speaker: "Rev. Michael Collins",
      scripture: "Luke 5",

      fillIns: [
        "“Put out into deep water, and let down the nets for a catch.”",
        "Jesus makes the first move: ____",
        "Loved one’s, the lordship of Christ is never confined to the religious corners of our existence.",
        "Jesus’ instructions are ____",
        "Biblical faith is not irrational optimism.",
        "For Peter, on the shore Jesus was ____, but in the deep water, ____",
        "What is ____?",
        "This week, begin by ____"
      ]
    };

    /*
      ============================================
      DON'T EDIT BELOW THIS LINE
      ============================================
    */

    document.getElementById("churchName").textContent = sermon.churchName;
    document.getElementById("sermonTitle").textContent = sermon.title;
    document.getElementById("sermonSubtitle").textContent = sermon.subtitle;
    document.getElementById("sermonDate").textContent = sermon.date;
    document.getElementById("speaker").textContent = sermon.speaker;
    document.getElementById("scripture").textContent = sermon.scripture;

    const fillInContainer = document.getElementById("fillInNotes");

    sermon.fillIns.forEach((line, index) => {
      const wrapper = document.createElement("p");
      wrapper.className = "note-line";

      const parts = line.split("____");

      parts.forEach((part, partIndex) => {
        wrapper.appendChild(document.createTextNode(part));

        if (partIndex < parts.length - 1) {
          const input = document.createElement("input");
          input.type = "text";
          input.setAttribute("aria-label", `Fill in blank ${index + 1}`);
          wrapper.appendChild(input);
        }
      });

      fillInContainer.appendChild(wrapper);
    });

    function clearAnswers() {
      const confirmed = confirm("Clear all answers on this page?");
      if (!confirmed) return;

      document.querySelectorAll("input, textarea").forEach(field => {
        field.value = "";
      });
    }

    function downloadNotes() {
      const title = sermon.title;
      const date = sermon.date;
      const speaker = sermon.speaker;
      const scripture = sermon.scripture;

      let output = `${title}\n${date}\n${speaker}\n${scripture}\n\nFill-In Notes\n`;

      const lines = document.querySelectorAll(".note-line");

      lines.forEach((line, index) => {
        let text = "";
        line.childNodes.forEach(node => {
          if (node.nodeType === Node.TEXT_NODE) {
            text += node.textContent;
          } else if (node.tagName === "INPUT") {
            text += node.value || "__________";
          }
        });
        output += `${index + 1}. ${text}\n`;
      });

      output += `\nPersonal Notes\n${document.getElementById("personalNotes").value}\n`;
      output += `\nPrayer / Next Steps\n${document.getElementById("nextSteps").value}\n`;

      const blob = new Blob([output], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "sermon-notes.txt";
      link.click();
      URL.revokeObjectURL(link.href);
    }
  </script>
</body>
</html>
